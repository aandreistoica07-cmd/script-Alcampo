name: Alcampo Script Automation Optimized

on:
  workflow_dispatch:
    # Allow manual runs from Actions tab
    inputs:
      threads:
        description: 'Número de hilos concurrentes'
        required: true
        default: '4'
        type: string

jobs:
  run-optimized-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      contents: write  # Crucial to allow committing results back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Fetch all history so git diff and push work correctly

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: './script_alcampo_activacion telegram'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium webdriver-manager requests pandas openpyxl

      - name: Run Optimized Scraper
        working-directory: './script_alcampo_activacion telegram'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          ACCOUNTS_B64: ${{ secrets.ACCOUNTS_BASE64 }}
        run: |
          THREADS="${{ github.event.inputs.threads || '4' }}"
          echo "Ejecutando con $THREADS hilos..."
          python script_optimizado.py --threads $THREADS --send-telegram

      - name: Update Global History Database
        working-directory: './script_alcampo_activacion telegram'
        run: |
          python update_history.py --version optimizada

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add history JSON only (Excel is sent via Telegram, not stored in repo)
          git add docs/history.json
          
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No hay cambios en los resultados para subir."
          else
            git commit -m "📊 Auto-update Alcampo scraper results and history [skip ci]"
            git push origin main
          fi
