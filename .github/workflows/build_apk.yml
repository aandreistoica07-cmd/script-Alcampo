name: Build Android APK

on:
  push:
    paths:
      - 'android_app/**'
      - 'dashboard/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Compilar Alcampo Scanner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar Assets Web en la App
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r dashboard/* android_app/app/src/main/assets/

      - name: Dar permisos de ejecución a Gradlew
        run: |
          cd android_app
          chmod +x gradlew || true

      - name: Compilar APK Debug
        working-directory: ./android_app
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          ./gradlew assembleDebug --stacktrace

      - name: Subir Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: Alcampo_Scanner_v1.0_Debug_APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
