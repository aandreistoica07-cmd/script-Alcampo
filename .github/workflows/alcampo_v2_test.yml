name: Alcampo Script v2 Test

on:
  workflow_dispatch:

jobs:
  run-script-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: './antigravity_projects/script_alcampo_activacion telegram'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium webdriver-manager requests pandas openpyxl

      - name: Run script_v2
        working-directory: './antigravity_projects/script_alcampo_activacion telegram'
        run: python script_v2.py

      - name: Upload failed accounts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuentas-fail-json
          path: './antigravity_projects/script_alcampo_activacion telegram/cuentas_fail.json'
