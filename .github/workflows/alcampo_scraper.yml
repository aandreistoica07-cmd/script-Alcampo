name: Alcampo Balance Checker

on:
  # schedule:
  #   # Ejecutar todos los días a las 07:00 AM UTC (09:00 AM hora española de verano)
  #   - cron: '0 7 * * *'
  workflow_dispatch:
    # Permitir ejecución manual desde la pestaña Actions de GitHub
    inputs:
      threads:
        description: 'Número de hilos concurrentes'
        required: true
        default: '4'
        type: string

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager pandas openpyxl requests

      - name: Instalar Google Chrome (Headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Ejecutar Script de Balance de Alcampo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          THREADS="${{ github.event.inputs.threads || '4' }}"
          echo "Ejecutando con $THREADS hilos..."
          python "script_alcampo_activacion telegram/script_optimizado.py" --threads $THREADS --send-telegram
