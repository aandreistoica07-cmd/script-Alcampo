name: Check Single Account Balance

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Account Email'
        required: true
      password:
        description: 'Account Password'
        required: true
      check_id:
        description: 'Check Identifier'
        required: false
      card_number:
        description: 'Existing card number (skip portal scraping if provided)'
        required: false


jobs:
  check-account:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install selenium webdriver-manager requests

      - name: Run Single Account Verification
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          CHECK_ID: ${{ github.event.inputs.check_id }}
          EXISTING_CARD_NUMBER: ${{ github.event.inputs.card_number }}
        run: |
          python "script_alcampo_activacion telegram/script_optimizado.py" --check-single "${{ github.event.inputs.email }}" "${{ github.event.inputs.password }}"
