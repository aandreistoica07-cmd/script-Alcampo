name: Alcampo Scraper - Auto-Recovery 2-Pass Matrix

on:
  workflow_dispatch:
    inputs:
      accounts_per_vm:
        description: 'Cuentas objetivo por VM (Golden Ratio: 75 por VM = 7 VMs para 512 cuentas)'
        required: false
        default: '75'
      test_limit:
        description: 'Opcional: Probar solo N cuentas (ej. 4) en cola separada (test_queue) sin tocar la cola de 512'
        required: false
        default: ''
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: alcampo-scraper-matrix-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPT_DIRECT_LOYALTY_REDIRECT: '1'
  OPT_DYNAMIC_WAIT: '1'
  OPT_EAGER_LIGHT_CHROME: '1'
  OPT_ADAPTIVE_PACING: '1'
  OPT_IP_CANARY: '1'
  MAX_EXECUTION_MINUTES: '13.5'
  EXPECTED_ACCOUNTS_COUNT: '512'
  FIREBASE_QUEUE_PREFIX: ${{ github.event.inputs.test_limit && 'test_' || '' }}

jobs:
  prepare:
    name: 🔍 Prepare Matrix & Validate Source (512)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_shards: ${{ steps.set-matrix.outputs.total_shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'script_alcampo_activacion telegram/requirements.txt'

      - name: Instalar requests
        run: pip install requests

      - name: Validar Fuente (512 Cuentas) y Calcular Shards Dinámicos
        id: set-matrix
        env:
          ACCOUNTS_B64: ${{ secrets.ACCOUNTS_BASE64 }}
          INPUT_PER_VM: ${{ github.event.inputs.accounts_per_vm }}
          TEST_LIMIT: ${{ github.event.inputs.test_limit }}
        run: |
          python -c "
          import json, math, os, sys, base64, gzip

          expected_total = int(os.environ.get('EXPECTED_ACCOUNTS_COUNT') or '512')
          accounts_b64 = (os.environ.get('ACCOUNTS_B64') or '').strip()
          if accounts_b64 and len(accounts_b64) > 10:
              for line in accounts_b64.splitlines():
                  if line.strip():
                      print(f'::add-mask::{line.strip()}', flush=True)
              try:
                  raw = base64.b64decode(accounts_b64)
                  if len(raw) >= 2 and raw[0] == 0x1F and raw[1] == 0x8B:
                      raw = gzip.decompress(raw)
                  accounts = json.loads(raw.decode('utf-8'))
              except Exception as e:
                  print(f'❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 inválido ({type(e).__name__}).')
                  sys.exit(1)
              source_name = 'Secret ACCOUNTS_BASE64'
          else:
              if not os.path.exists('script_alcampo_activacion telegram/accounts.json'):
                  print('❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 vacío y accounts.json no existe.')
                  sys.exit(1)
              with open('script_alcampo_activacion telegram/accounts.json', 'r', encoding='utf-8') as f:
                  accounts = json.load(f)
              source_name = 'script_alcampo_activacion telegram/accounts.json'

          if not isinstance(accounts, list) or len(accounts) != expected_total:
              cnt = len(accounts) if isinstance(accounts, list) else -1
              print(f'❌ ERROR CRÍTICO: {source_name} contiene {cnt} cuentas, pero se esperaban exactamente {expected_total} (495 + 17 verificadas). Actualiza el secret ACCOUNTS_BASE64.')
              sys.exit(1)

          test_limit_str = (os.environ.get('TEST_LIMIT') or '').strip()
          if test_limit_str.isdigit() and int(test_limit_str) > 0:
              accounts = accounts[:int(test_limit_str)]
              print(f'🧪 MODO PRUEBA AISLADA: usando {len(accounts)} cuentas en cola test_queue.')

          total = len(accounts)
          per_vm = int(os.environ.get('INPUT_PER_VM') or '75')
          shards = math.ceil(total / per_vm) if total > 0 else 1
          
          matrix_data = {'shard': list(range(shards))}
          print(f'Total cuentas: {total}, Shards generados: {shards}')
          
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'matrix={json.dumps(matrix_data)}\n')
              f.write(f'total_shards={shards}\n')
          "

      - name: Inicializar Cola Dinámica en Firebase
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          ACCOUNTS_B64: ${{ secrets.ACCOUNTS_BASE64 }}
          TEST_LIMIT: ${{ github.event.inputs.test_limit }}
        run: |
          python -c "
          import os, sys, json, base64, gzip
          from pathlib import Path
          expected_total = int(os.environ.get('EXPECTED_ACCOUNTS_COUNT') or '512')
          b64 = (os.environ.get('ACCOUNTS_B64') or '').strip()
          acc_path = Path('script_alcampo_activacion telegram/accounts.json')
          if b64 and len(b64) > 10:
              for line in b64.splitlines():
                  if line.strip():
                      print(f'::add-mask::{line.strip()}', flush=True)
              try:
                  raw = base64.b64decode(b64)
                  if len(raw) >= 2 and raw[0] == 0x1F and raw[1] == 0x8B:
                      raw = gzip.decompress(raw)
                  data = json.loads(raw.decode('utf-8'))
              except Exception as e:
                  print(f'❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 inválido ({type(e).__name__}).')
                  sys.exit(1)
              if not isinstance(data, list) or len(data) != expected_total:
                  print(f'❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 tiene {len(data) if isinstance(data, list) else -1} cuentas, se esperaban {expected_total}.')
                  sys.exit(1)
              acc_path.write_bytes(raw)
          else:
              if not acc_path.exists():
                  print('❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 vacío y accounts.json no existe.')
                  sys.exit(1)
              data = json.loads(acc_path.read_text(encoding='utf-8'))
              if not isinstance(data, list) or len(data) != expected_total:
                  print(f'❌ ERROR CRÍTICO: accounts.json tiene {len(data) if isinstance(data, list) else -1} cuentas, se esperaban {expected_total}.')
                  sys.exit(1)
          test_limit_str = (os.environ.get('TEST_LIMIT') or '').strip()
          if test_limit_str.isdigit() and int(test_limit_str) > 0:
              with open('script_alcampo_activacion telegram/test_subset.json', 'w', encoding='utf-8', newline='\r\n') as f:
                  json.dump(data[:int(test_limit_str)], f, indent=2, ensure_ascii=False)
          "
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            python "script_alcampo_activacion telegram/script_optimizado.py" --input-file "script_alcampo_activacion telegram/test_subset.json" --init-queue
          else
            python "script_alcampo_activacion telegram/script_optimizado.py" --init-queue
          fi

  scrape-pass1:
    name: 🚀 Pasada 1 (Matrix Shard ${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'script_alcampo_activacion telegram/requirements.txt'

      - name: Instalar Google Chrome y Dependencias
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          pip install -r "script_alcampo_activacion telegram/requirements.txt" || pip install selenium webdriver-manager pandas openpyxl requests

      - name: Decodificar y Validar Cuentas desde Secrets (512 esperadas)
        env:
          ACCOUNTS_B64: ${{ secrets.ACCOUNTS_BASE64 }}
          TEST_LIMIT: ${{ github.event.inputs.test_limit }}
        run: |
          python -c "
          import os, sys, json, base64, gzip
          from pathlib import Path
          expected_total = int(os.environ.get('EXPECTED_ACCOUNTS_COUNT') or '512')
          b64 = (os.environ.get('ACCOUNTS_B64') or '').strip()
          acc_path = Path('script_alcampo_activacion telegram/accounts.json')
          if b64 and len(b64) > 10:
              for line in b64.splitlines():
                  if line.strip():
                      print(f'::add-mask::{line.strip()}', flush=True)
              try:
                  raw = base64.b64decode(b64)
                  if len(raw) >= 2 and raw[0] == 0x1F and raw[1] == 0x8B:
                      raw = gzip.decompress(raw)
                  data = json.loads(raw.decode('utf-8'))
              except Exception as e:
                  print(f'❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 inválido ({type(e).__name__}).')
                  sys.exit(1)
              if not isinstance(data, list) or len(data) != expected_total:
                  print(f'❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 tiene {len(data) if isinstance(data, list) else -1} cuentas, se esperaban {expected_total}.')
                  sys.exit(1)
              acc_path.write_bytes(raw)
          else:
              if not acc_path.exists():
                  print('❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 vacío y accounts.json no existe.')
                  sys.exit(1)
              data = json.loads(acc_path.read_text(encoding='utf-8'))
              if not isinstance(data, list) or len(data) != expected_total:
                  print(f'❌ ERROR CRÍTICO: accounts.json tiene {len(data) if isinstance(data, list) else -1} cuentas, se esperaban {expected_total}.')
                  sys.exit(1)
          test_limit_str = (os.environ.get('TEST_LIMIT') or '').strip()
          if test_limit_str.isdigit() and int(test_limit_str) > 0:
              with open('script_alcampo_activacion telegram/test_subset.json', 'w', encoding='utf-8', newline='\r\n') as f:
                  json.dump(data[:int(test_limit_str)], f, indent=2, ensure_ascii=False)
          "

      - name: Ejecutar Scraper con Cola Dinámica Firebase (VM ${{ matrix.shard }})
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          TEST_LIMIT: ${{ github.event.inputs.test_limit }}
        run: |
          cd "script_alcampo_activacion telegram"
          INPUT_ARG=""
          if [ -n "$TEST_LIMIT" ]; then
            INPUT_ARG="--input-file test_subset.json"
          fi
          python script_optimizado.py \
            --use-queue \
            $INPUT_ARG \
            --shard-id ${{ matrix.shard }} \
            --total-shards ${{ needs.prepare.outputs.total_shards }} \
            --threads 2 \
            --no-telegram \
            --output-file "saldos_pass1_shard_${{ matrix.shard }}.xlsx"

      - name: Guardar Artefacto Shard Pasada 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pass1-shard-${{ matrix.shard }}
          path: "script_alcampo_activacion telegram/saldos_pass1_shard_${{ matrix.shard }}.xlsx"
          retention-days: 1

  check-timeouts:
    name: 🕵️ Detectar Timeouts para Reintento
    needs: [scrape-pass1]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_timeouts: ${{ steps.check.outputs.has_timeouts }}
      failed_count: ${{ steps.check.outputs.failed_count }}
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'script_alcampo_activacion telegram/requirements.txt'

      - name: Descargar Artefactos Pasada 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pass1-shard-*
          merge-multiple: true
          path: ./pass1_artifacts

      - name: Instalar pandas y openpyxl
        run: pip install pandas openpyxl requests

      - name: Filtrar Cuentas Fallidas por IP/Timeout
        id: check
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          python scripts/merge_and_retry.py --mode check-timeouts --input-dir ./pass1_artifacts --failed-json failed_accounts.json

      - name: Inicializar Cola de Reintento en Firebase
        if: steps.check.outputs.has_timeouts == 'true'
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          python "script_alcampo_activacion telegram/script_optimizado.py" --input-file failed_accounts.json --init-queue

      - name: Subir Artefacto de Cuentas Fallidas
        if: steps.check.outputs.has_timeouts == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.0
        with:
          name: failed-accounts-json
          path: failed_accounts.json
          retention-days: 1

  scrape-pass2-retry:
    name: 🔄 Pasada 2 Auto-Curación (IP Nueva Shard ${{ matrix.shard }})
    needs: [check-timeouts]
    if: needs.check-timeouts.outputs.has_timeouts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        total_shards: [2]

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'script_alcampo_activacion telegram/requirements.txt'

      - name: Instalar Google Chrome y Dependencias
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          pip install -r "script_alcampo_activacion telegram/requirements.txt" || pip install selenium webdriver-manager pandas openpyxl requests

      - name: Decodificar y Validar Cuentas desde Secrets (512 esperadas)
        env:
          ACCOUNTS_B64: ${{ secrets.ACCOUNTS_BASE64 }}
        run: |
          python -c "
          import os, sys, json, base64, gzip
          from pathlib import Path
          expected_total = int(os.environ.get('EXPECTED_ACCOUNTS_COUNT') or '512')
          b64 = (os.environ.get('ACCOUNTS_B64') or '').strip()
          acc_path = Path('script_alcampo_activacion telegram/accounts.json')
          if b64 and len(b64) > 10:
              for line in b64.splitlines():
                  if line.strip():
                      print(f'::add-mask::{line.strip()}', flush=True)
              try:
                  raw = base64.b64decode(b64)
                  if len(raw) >= 2 and raw[0] == 0x1F and raw[1] == 0x8B:
                      raw = gzip.decompress(raw)
                  data = json.loads(raw.decode('utf-8'))
              except Exception as e:
                  print(f'❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 inválido ({type(e).__name__}).')
                  sys.exit(1)
              if not isinstance(data, list) or len(data) != expected_total:
                  print(f'❌ ERROR CRÍTICO: Secret ACCOUNTS_BASE64 tiene {len(data) if isinstance(data, list) else -1} cuentas, se esperaban {expected_total}.')
                  sys.exit(1)
              acc_path.write_bytes(raw)
          "

      - name: Descargar Cuentas Fallidas JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: failed-accounts-json

      - name: Reintentar Cuentas Fallidas con Cola Dinámica (IP Nueva Shard ${{ matrix.shard }})
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          ACCOUNTS_B64: ${{ secrets.ACCOUNTS_BASE64 }}
        run: |
          cd "script_alcampo_activacion telegram"
          python script_optimizado.py \
            --use-queue \
            --input-file "../failed_accounts.json" \
            --shard-id ${{ matrix.shard }} \
            --total-shards ${{ matrix.total_shards }} \
            --threads 2 \
            --no-telegram \
            --output-file "saldos_retry_shard_${{ matrix.shard }}.xlsx"

      - name: Subir Artefacto Pasada 2 (Shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pass2-retry-shard-${{ matrix.shard }}
          path: "script_alcampo_activacion telegram/saldos_retry_shard_${{ matrix.shard }}.xlsx"
          retention-days: 1

  final-consolidate:
    name: 📊 Consolidar y Notificar Telegram
    needs: [scrape-pass1, check-timeouts, scrape-pass2-retry]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'script_alcampo_activacion telegram/requirements.txt'

      - name: Descargar Todos los Artefactos (Pasada 1 y 2)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*shard-*'
          merge-multiple: true
          path: ./all_final_shards

      - name: Instalar dependencias
        run: pip install pandas openpyxl requests

      - name: Consolidar y Enviar Único Informe a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          python scripts/merge_and_retry.py --mode final-merge --input-dir ./all_final_shards --output-excel REPORTE_DEFINITIVO_TELEGRAM.xlsx

      - name: Actualizar Archivos de Analytics y Top 10 en Git
        if: ${{ !github.event.inputs.test_limit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/top_accounts.json docs/history.json top_accounts.json || true
          if ! git diff --cached --quiet; then
            git commit -m "📊 Auto-update Alcampo scraper results and history [skip ci]"
            for attempt in 1 2 3; do
              echo "🔄 Intento $attempt/3 de sincronización git pull --rebase + push..."
              if git pull --rebase origin main && git push origin main; then
                echo "✔ Push de analíticas completado en intento $attempt."
                break
              fi
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase -X ours origin main || true
              sleep $((attempt * 2))
            done
          else
            echo "No hay cambios que commitear."
          fi
