name: Alcampo Scraper Diario

on:
  schedule:
    # Se ejecuta todos los días a las 09:00 UTC
    - cron: '0 9 * * *'
  # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar dependencias
        # Se asume que requirements.txt está en la misma carpeta que el script
        # Ajusta la ruta si es necesario
        run: |
          pip install --upgrade pip
          pip install -r "antigravity_projects/script_alcampo_activacion telegram/requirements.txt"

      - name: Ejecutar Scraper
        # Ejecutamos el script apuntando a la ruta correcta desde la raíz del repositorio
        run: python "antigravity_projects/script_alcampo_activacion telegram/script.py"
