<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Paint: Handwriting AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Neural Paint</h1>
            <p>Teach the AI to recognize your handwriting in real-time.</p>
        </header>

        <main>
            <div class="panel draw-panel">
                <div class="canvas-container">
                    <canvas id="drawCanvas" width="280" height="280"></canvas>
                    <div class="tools">
                        <button id="clearBtn" class="btn secondary">Clear</button>
                        <button id="predictBtn" class="btn primary">Predict</button>
                    </div>
                </div>
                <div class="preview-container">
                    <p>AI Input (28x28)</p>
                    <canvas id="smallCanvas" width="28" height="28"></canvas>
                </div>
            </div>

            <div class="panel info-panel">
                <div class="metrics">
                    <div class="chart-box">
                        <canvas id="lossChart"></canvas>
                    </div>
                    <div class="chart-box">
                        <canvas id="accChart"></canvas>
                    </div>
                </div>

                <div class="controls">
                    <button id="trainBtn" class="btn glow">Start Training</button>
                    <button id="resetBtn" class="btn danger">Reset Model</button>
                </div>

                <div class="results">
                    <h3>Prediction</h3>
                    <div id="bars">
                        <!-- Bars generated by JS -->
                    </div>
                </div>

                <div class="network-viz">
                    <h3>Neural Network View</h3>
                    <div class="viz-container">
                        <canvas id="netCanvas" width="400" height="300"></canvas>
                    </div>
                    <p style="font-size:0.8rem; color:#94a3b8; text-align:center;">
                        Input (784) -> Hidden (256) -> Output (10)
                    </p>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>

</html>
