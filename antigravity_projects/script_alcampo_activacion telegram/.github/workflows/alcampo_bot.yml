name: Alcampo Bot

on:
  schedule:
    - cron: '0 8,14,20 * * *'  # Ejecutar a las 8:00, 14:00 y 20:00 UTC
  workflow_dispatch:           # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run script
        env:
          # Si decides usar secretos en el futuro, los usarías así:
          # TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # CHAT_ID: ${{ secrets.CHAT_ID }}
          # Por ahora usa los que están en el código, pero CUIDADO si el repo es público.
          DISPLAY: :99
        run: python script.py
